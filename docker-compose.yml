# Local development infrastructure only. Project name `meetcon`.
# PostgreSQL, Redis, and Mailpit run here. The API and web app run on the host
# via `node run.mjs` / `run.bat` (http://localhost:5173).
# Production is a different Docker project: `meetcon-prod` in docker-compose.prod.yml.
name: meetcon

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      meetcon.environment: development
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetcon}
      POSTGRES_USER: ${POSTGRES_USER:-meetcon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetcon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-meetcon} -d ${POSTGRES_DB:-meetcon}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    labels:
      meetcon.environment: development
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    labels:
      meetcon.environment: development
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
  redis_data:
