# Production website. Docker project: meetcon-prod.
# Images: meetcon-api and meetcon-gateway, tagged with MEETCON_IMAGE_TAG (git sha, or "production").
# Only HTTPS port 30098 is published. PostgreSQL and Redis stay on the private network.
#
# This file must be started with --env-file .env.production and COMPOSE_DISABLE_ENV_FILE=1.
# That keeps the local development .env (localhost, Mailpit, password "meetcon") out of this stack.
# Local development is docker-compose.yml, project meetcon. Simulation is meetcon-sim.
name: meetcon-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      meetcon.environment: production
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env.production}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env.production}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meetcon_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    labels:
      meetcon.environment: production
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - meetcon_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: meetcon-api:${MEETCON_IMAGE_TAG:-production}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        MEETCON_IMAGE_TAG: ${MEETCON_IMAGE_TAG:-production}
        MEETCON_RUNTIME: production
    labels:
      meetcon.environment: production
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - meetcon_internal
    restart: "no"

  api:
    image: meetcon-api:${MEETCON_IMAGE_TAG:-production}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        MEETCON_IMAGE_TAG: ${MEETCON_IMAGE_TAG:-production}
        MEETCON_RUNTIME: production
    restart: unless-stopped
    labels:
      meetcon.environment: production
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      MEDIA_DIR: /data/media
    volumes:
      - media_data:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - meetcon_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  gateway:
    image: meetcon-gateway:${MEETCON_IMAGE_TAG:-production}
    build:
      context: .
      dockerfile: deploy/gateway/Dockerfile
      args:
        MEETCON_IMAGE_TAG: ${MEETCON_IMAGE_TAG:-production}
        MEETCON_RUNTIME: production
    restart: unless-stopped
    labels:
      meetcon.environment: production
    # VM port 30098 → container port 30098 (nginx). Public site stays on https://meetcon.aiadoptionecosystem.com.
    ports:
      - "0.0.0.0:30098:30098"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - meetcon_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:30098/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  meetcon_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_data:
