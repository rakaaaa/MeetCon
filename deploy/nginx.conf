worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 6m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # The public site is HTTPS. The VM proxy forwards plain HTTP to this port.
  map $http_x_forwarded_proto $meetcon_forwarded_proto {
    default $http_x_forwarded_proto;
    '' https;
  }

  upstream meetcon_api {
    server api:3001;
    keepalive 32;
  }

  server {
    # VM port 30098. TLS ends at https://meetcon.aiadoptionecosystem.com.
    listen 30098;
    server_name meetcon.aiadoptionecosystem.com _;
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
      proxy_pass http://meetcon_api/health;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      access_log off;
    }

    location /api/ {
      proxy_pass http://meetcon_api/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $meetcon_forwarded_proto;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      chunked_transfer_encoding off;
    }

    location /media/ {
      proxy_pass http://meetcon_api/media/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $meetcon_forwarded_proto;
      proxy_set_header Connection "";
      proxy_buffering off;
    }

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
