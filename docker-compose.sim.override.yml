# Pipeline simulation. Docker project: meetcon-sim.
# Own image tags (:simulation), own volumes, and localhost-only port 30998.
# A simulation build must not retag meetcon-api:production or meetcon-gateway:production.
name: meetcon-sim

services:
  postgres:
    labels:
      meetcon.environment: simulation
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_sim_data:/var/lib/postgresql/data

  redis:
    labels:
      meetcon.environment: simulation
    volumes:
      - redis_sim_data:/data

  migrate:
    image: meetcon-api:simulation
    labels:
      meetcon.environment: simulation
    build:
      args:
        MEETCON_IMAGE_TAG: simulation
        MEETCON_RUNTIME: simulation
    env_file: !override
      - .env.simulation

  api:
    image: meetcon-api:simulation
    labels:
      meetcon.environment: simulation
    build:
      args:
        MEETCON_IMAGE_TAG: simulation
        MEETCON_RUNTIME: simulation
    env_file: !override
      - .env.simulation
    volumes:
      - media_sim_data:/data/media

  gateway:
    image: meetcon-gateway:simulation
    labels:
      meetcon.environment: simulation
    build:
      args:
        MEETCON_IMAGE_TAG: simulation
        MEETCON_RUNTIME: simulation
    ports: !override
      - "127.0.0.1:${GATEWAY_PUBLIC_PORT:-30998}:30098"

volumes:
  postgres_sim_data:
  redis_sim_data:
  media_sim_data:
